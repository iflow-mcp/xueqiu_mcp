[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iflow-mcp-xueqiu-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.1.2",
    "pysnowball>=0.1.3",
    "python-dotenv>=1.0.0",
]

[project.scripts]
iflow-mcp-xueqiu-mcp = "iflow_mcp_xueqiu_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["iflow_mcp_xueqiu_mcp*"]
